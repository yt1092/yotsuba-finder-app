  <meta name="theme-color" content="#EEF6E2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#07140D" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>図鑑 - YOTSUBA FINDER</title>

<body>
<div class="app page-pad app--tabbar">

  <!-- ヘッダー -->
  <div style="display:flex;align-items:center;justify-content:space-between;">
    <h1 style="margin:0;font-size:34px;font-weight:700;">図鑑</h1>
    <button aria-label="検索" class="btn-icon" style="padding:0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    </button>
  </div>

  <!-- タブ切替（三つ葉の欄は出さない。三つ葉の記録のデータは消さずに残し、「すべて」には出る）
       「今日のよつば」は、見つけた写真とは別の一覧（「すべて」「四つ葉」には混ぜない。src/lib/gacha-list.ts） -->
  <div class="tabs tabs--three" style="margin-top:16px;">
    <button type="button" class="tab-btn tab-active" data-filter="all" aria-pressed="true">すべて</button>
    <button type="button" class="tab-btn" data-filter="四つ葉" aria-pressed="false">四つ葉</button>
    <button type="button" class="tab-btn" data-filter="gacha" aria-pressed="false">今日のよつば</button>
  </div>

  <!-- グリッドコンテナ（JS で描画） -->
  <div id="gridContainer"></div>

</div>
