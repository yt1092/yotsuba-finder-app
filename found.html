<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#EEF6E2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#07140D" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/src/styles/global.css">
  <title>四つ葉を発見 - YOTSUBA FINDER</title>
</head>
<body>
<div class="app page-pad app--actions">

  <!-- 背景グロー -->
  <div style="position:absolute;left:0;right:0;top:60px;height:460px;background:radial-gradient(circle,var(--glow) 0%,rgba(255,224,130,0) 65%);pointer-events:none;"></div>

  <!-- 装飾用 葉シルエット -->
  <svg width="390" height="460" viewBox="0 0 390 460" aria-hidden="true" style="position:absolute;left:0;top:0;display:block;pointer-events:none;">
    <use href="#lf" fill="#7CC36A" opacity="0.85" transform="translate(44 112) rotate(150) scale(0.55)"/>
    <use href="#lf" fill="#A8DC86" opacity="0.9" transform="translate(338 96) rotate(-140) scale(0.5)"/>
    <use href="#lf" fill="#5FAE55" opacity="0.8" transform="translate(22 232) rotate(100) scale(0.5)"/>
    <use href="#lf" fill="#8AD073" opacity="0.9" transform="translate(366 224) rotate(-100) scale(0.6)"/>
    <circle cx="96" cy="86" r="4" fill="#FFD66B"/>
    <circle cx="300" cy="140" r="4.5" fill="#FFD66B"/>
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" transform="translate(52 160)" fill="#F2B84B"/>
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" transform="translate(342 130) scale(1.2)" fill="#FFFFFF"/>
  </svg>

  <!-- ヘッダー -->
  <div style="position:relative;display:flex;align-items:center;justify-content:space-between;">
    <a href="scan.html" aria-label="閉じる" class="btn-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <div style="font-family:'Nunito',system-ui,sans-serif;font-size:16px;font-weight:800;letter-spacing:0.22em;padding:8px 14px;border-radius:16px;color:#3A2A00;background:linear-gradient(90deg,#FFE48A,#F2B84B);box-shadow:0 6px 16px rgba(242,184,75,0.45);">LUCKY FIND</div>
    <button type="button" id="shareBtn" aria-label="共有する" class="btn-icon" style="padding:0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></svg>
    </button>
  </div>

  <!-- 写真（金縁グラデーション枠） -->
  <div style="position:relative;width:310px;margin:24px auto 0;">
    <div style="padding:3px;border-radius:38px;background:var(--gold-frame);box-shadow:0 26px 50px rgba(20,60,30,0.35),0 0 50px rgba(255,214,107,0.45);">
      <div style="width:100%;border-radius:35px;overflow:hidden;aspect-ratio:1;background:#9BD083;">
        <img id="foundImg" src="" alt="発見した四つ葉" style="width:100%;height:100%;object-fit:cover;display:block;">
      </div>
    </div>
    <!-- 四つ葉バッジ -->
    <div style="position:absolute;left:50%;bottom:-30px;width:60px;height:60px;margin-left:-30px;box-sizing:border-box;border-radius:30px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#FFF1BE,#F2B84B);border:3px solid #FFFFFF;box-shadow:0 10px 24px rgba(242,184,75,0.55);">
      <svg width="36" height="36" viewBox="-42 -42 84 84" aria-hidden="true"><use href="#cH" transform="rotate(8)"/></svg>
    </div>
  </div>

  <h1 style="position:relative;margin:44px 0 0;text-align:center;font-size:34px;line-height:1.2;font-weight:700;">四つ葉を発見！</h1>

  <!-- 保存チップ（「確認してから入れる」なら「図鑑に入れました」、「自動で入れる」なら「図鑑に自動で入れました」。src/pages/found.ts） -->
  <div style="position:relative;display:flex;justify-content:center;margin-top:10px;">
    <span style="display:flex;align-items:center;gap:8px;box-sizing:border-box;height:32px;padding:0 14px;border-radius:16px;font-size:16px;font-weight:700;color:var(--text);" class="card-surface">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--accent);"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      <span id="savedText">図鑑に入れました</span>
    </span>
  </div>

  <!-- 判定・日時テーブル -->
  <div style="position:relative;margin-top:14px;border-radius:22px;" class="card-surface">
    <div style="display:flex;align-items:center;justify-content:space-between;box-sizing:border-box;height:48px;padding:0 16px;border-bottom:1px solid var(--hair);">
      <span style="font-size:17px;color:var(--text2);">判定</span>
      <span style="padding:3px 12px;border-radius:12px;font-size:16px;font-weight:700;color:#3A2A00;background:linear-gradient(90deg,#FFE48A,#F2B84B);">四つ葉</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;box-sizing:border-box;height:48px;padding:0 16px;">
      <span style="font-size:17px;color:var(--text2);">日時</span>
      <span id="foundDate" style="font-family:'Nunito',system-ui,sans-serif;font-size:17px;font-weight:800;"></span>
    </div>
  </div>

  <!-- ボタン -->
  <div class="bottom-actions">
    <a href="scan.html" class="btn-primary">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      続けて探す
    </a>
    <a href="collection.html" class="btn-secondary">図鑑で見る</a>
  </div>

</div>
<script type="module" src="/src/pages/found.ts"></script>
</body>
</html>
