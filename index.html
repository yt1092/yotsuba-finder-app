<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#EEF6E2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#07140D" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/src/styles/global.css">
  <title>ホーム - YOTSUBA FINDER</title>
  <script>
    // スタート画面を出すかどうかを、画面を描く前に決める（ホームが一瞬見えてしまわないように）
    // 出すのは、アプリを開いて最初にこの画面を表示したときだけ。
    // URL に #/scan などの画面の指定や、?detector=dummy などの開発用の指定があるときは出さない
    try {
      if (!location.hash && !location.search && !sessionStorage.getItem('yotsuba-started')) {
        document.documentElement.setAttribute('data-start', '');
      }
    } catch (e) { /* sessionStorage が使えないときは、スタート画面を出さない */ }
    // 初めて開いたときの説明の 1 枚目の絵を、先に読み込む（説明を見たあとは読み込まない）
    try {
      if (localStorage.getItem('yotsuba-tutorial-seen') !== '1') {
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image'; l.href = '/images/tutorial-1-640.webp';
        l.setAttribute('imagesrcset', '/images/tutorial-1-640.webp 640w, /images/tutorial-1.webp 852w');
        l.setAttribute('imagesizes', '100vw');
        document.head.appendChild(l);
      }
    } catch (e) { /* 使えなければ、先読みしない */ }
  </script>
</head>
<body>
<!-- スタート画面（アプリを開いたときに、最初に出す） -->
<div id="startScreen" class="app page-pad app--actions start-screen">
  <div class="start-body">
    <span class="start-logo">
      <svg width="156" height="156" viewBox="-42 -42 84 84" role="img" aria-label="四つ葉のクローバー"><use href="#cH" transform="rotate(8)"/></svg>
    </span>
    <h1 class="start-title">YOTSUBA FINDER</h1>
    <p class="start-lead">向けるだけで、<wbr>四つ葉を自動で見つけます</p>
  </div>
  <div class="bottom-actions">
    <button type="button" id="startBtn" class="btn-primary btn-large start-btn">はじめる</button>
  </div>
</div>

<div class="app page-pad app--tabbar home-screen">

  <!-- ヘッダー -->
  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--surface-line);box-shadow:var(--surface-shadow);">
        <svg width="24" height="24" viewBox="-42 -42 84 84" aria-hidden="true"><use href="#cH" transform="rotate(8)"/></svg>
      </span>
      <span style="font-family:'Nunito',system-ui,sans-serif;font-size:20px;font-weight:800;letter-spacing:0.02em;">YOTSUBA FINDER</span>
    </div>
    <a href="settings.html" aria-label="設定" class="btn-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </a>
  </div>

  <!-- ヒーローカード -->
  <section style="margin-top:18px;border-radius:32px;overflow:hidden;background:var(--surface);border:1px solid var(--surface-line);box-shadow:0 24px 50px rgba(20,60,30,0.22);">
    <!-- 大きな画像: 最初のイラストと、見つけた四つ葉の写真を順番に切り替える（src/components/hero-carousel.ts） -->
    <div id="heroMedia" class="hero-media">
    <div id="heroIllustration" class="hero-slide hero-slide--active">
    <!-- ライト用イラスト -->
    <svg class="on-light" width="350" height="200" viewBox="0 0 350 200" role="img" aria-label="朝日の差す草原で光る四つ葉のクローバー">
      <defs>
        <linearGradient id="hSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6CF"/><stop offset="0.55" stop-color="#E4F4D8"/><stop offset="1" stop-color="#CBE8C0"/></linearGradient>
        <radialGradient id="hSun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFF1B8" stop-opacity="0.95"/><stop offset="1" stop-color="#FFF1B8" stop-opacity="0"/></radialGradient>
        <filter id="fB2h" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
      </defs>
      <rect width="350" height="200" fill="url(#hSky)"/>
      <circle cx="290" cy="44" r="72" fill="url(#hSun)"/>
      <circle cx="290" cy="44" r="20" fill="#FFE28A"/>
      <path d="M0 122 C60 92 120 102 180 114 S300 98 350 112 V200 H0 Z" fill="#C4E4AA"/>
      <path d="M0 152 C70 126 150 142 220 136 S320 130 350 142 V200 H0 Z" fill="#9BD083"/>
      <path d="M0 180 C80 162 160 174 230 168 S320 166 350 172 V200 H0 Z" fill="#6DB862"/>
      <g stroke="rgba(30,100,45,0.35)" stroke-width="0.6">
        <use href="#c3" fill="#86CB72" transform="translate(40 152) rotate(15) scale(0.6)"/>
        <use href="#c3" fill="#7DC36A" transform="translate(310 160) rotate(-25) scale(0.7)"/>
        <use href="#c3" fill="#5FAE55" transform="translate(92 176) rotate(40) scale(0.8)"/>
        <use href="#c3" fill="#5BAA52" transform="translate(262 178) rotate(5) scale(0.9)"/>
      </g>
      <ellipse cx="175" cy="168" rx="46" ry="8" fill="rgba(20,80,35,0.28)" filter="url(#fB2h)"/>
      <g style="filter:drop-shadow(0 6px 8px rgba(20,80,35,0.35))"><use href="#cH" transform="translate(175 108) rotate(8) scale(1.45)"/></g>
      <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" transform="translate(58 50)" fill="#FFD66B"/>
      <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" transform="translate(246 104) scale(0.8)" fill="#FFFFFF"/>
    </svg>
    <!-- ダーク用イラスト -->
    <svg class="on-dark" width="350" height="200" viewBox="0 0 350 200" role="img" aria-label="月明かりの森で光る四つ葉のクローバー">
      <defs>
        <linearGradient id="nSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0F4A38"/><stop offset="1" stop-color="#0A2A1E"/></linearGradient>
        <radialGradient id="nMoon" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E8F5B8" stop-opacity="0.55"/><stop offset="1" stop-color="#E8F5B8" stop-opacity="0"/></radialGradient>
        <filter id="fB2n" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
      </defs>
      <rect width="350" height="200" fill="url(#nSky)"/>
      <circle cx="290" cy="44" r="72" fill="url(#nMoon)"/>
      <circle cx="290" cy="44" r="16" fill="#F3F8C8"/>
      <path d="M0 122 C60 92 120 102 180 114 S300 98 350 112 V200 H0 Z" fill="#14523A"/>
      <path d="M0 152 C70 126 150 142 220 136 S320 130 350 142 V200 H0 Z" fill="#0F4030"/>
      <path d="M0 180 C80 162 160 174 230 168 S320 166 350 172 V200 H0 Z" fill="#0B3022"/>
      <g stroke="rgba(0,0,0,0.25)" stroke-width="0.6" opacity="0.85">
        <use href="#c3" fill="#1F7A4D" transform="translate(40 152) rotate(15) scale(0.6)"/>
        <use href="#c3" fill="#1A6B44" transform="translate(310 160) rotate(-25) scale(0.7)"/>
      </g>
      <circle cx="175" cy="110" r="78" fill="rgba(198,243,107,0.16)"/>
      <g filter="url(#fB2n)" fill="#FFE48A">
        <circle cx="64" cy="96" r="4"/><circle cx="116" cy="60" r="3.5"/>
        <circle cx="250" cy="120" r="4"/><circle cx="304" cy="152" r="3.5"/>
      </g>
      <g fill="#FFF3B0">
        <circle cx="64" cy="96" r="1.6"/><circle cx="116" cy="60" r="1.4"/>
        <circle cx="250" cy="120" r="1.6"/><circle cx="304" cy="152" r="1.4"/>
      </g>
      <g style="filter:drop-shadow(0 0 14px rgba(160,240,90,0.65))"><use href="#cH" transform="translate(175 108) rotate(8) scale(1.45)"/></g>
    </svg>
    </div>
    <!-- 今の位置を示すドット（写真が 1 枚以上のときだけ出す）。列全体が押せる範囲 -->
    <div id="heroDots" class="hero-dots" hidden role="slider" tabindex="0" aria-label="表示する画像" aria-valuemin="1"></div>
    </div>

    <div style="padding:16px 16px 18px;text-align:center;">
      <h1 style="margin:0;font-size:24px;line-height:1.3;font-weight:700;">幸運を、カメラで見つける</h1>
      <p style="margin:4px 0 16px;font-size:17px;color:var(--text2);word-break:keep-all;">向けるだけで、<wbr>四つ葉を自動で見つけます</p>
      <a href="permission.html" class="btn-primary btn-large">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        スキャンを始める
      </a>
    </div>
  </section>

  <!-- レベル（タップすると、きろくの画面。src/lib/progress.ts） -->
  <a href="kiroku.html" class="card-surface level-card" aria-describedby="levelNext">
    <span class="level-head">
      <span class="level-lv font-nunito" id="levelLv">Lv.1</span>
      <span class="level-rank" id="levelRank">たね</span>
      <span class="level-more" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </span>
    </span>
    <span class="level-bar" aria-hidden="true"><span class="level-bar-fill" id="levelBar"></span></span>
    <span class="level-next" id="levelNext">次まで あと 100</span>
  </a>

  <!-- クイックアクセス -->
  <div style="display:flex;gap:12px;margin-top:16px;">
    <a href="photo-pick.html" style="flex:1.5;display:flex;align-items:center;gap:10px;box-sizing:border-box;min-height:88px;padding:12px;border-radius:24px;text-decoration:none;color:var(--text);" class="card-surface">
      <span style="width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent);background:var(--chip);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 3.5 3L15 13l5 4.5"/></svg>
      </span>
      <span>
        <span style="display:block;font-size:18px;font-weight:700;line-height:1.3;white-space:nowrap;">写真から探す</span>
        <span style="display:block;font-size:16px;color:var(--text2);line-height:1.35;word-break:keep-all;">手持ちの写真を<wbr>調べる</span>
      </span>
    </a>
    <a href="collection.html" style="flex:1;display:flex;flex-direction:column;justify-content:center;box-sizing:border-box;min-height:88px;padding:12px 14px;border-radius:24px;text-decoration:none;color:var(--text);" class="card-surface">
      <span style="font-family:'Nunito',system-ui,sans-serif;font-size:32px;font-weight:800;line-height:1.1;color:var(--accent);" id="cloverCount">0</span>
      <span style="font-size:16px;font-weight:700;color:var(--text2);">見つけた四つ葉</span>
    </a>
  </div>

  <!-- 今日のよつば（gacha.html） -->
  <a href="gacha.html" class="card-surface gacha-entry">
    <span class="gacha-entry-icon" aria-hidden="true">
      <svg width="22" height="22" viewBox="-42 -42 84 84"><use href="#cH" transform="rotate(8)"/></svg>
    </span>
    <span class="gacha-entry-text">今日のよつば</span>
    <!-- 準備ができた印（DiT のモデルが、この端末で読み込めるときだけ。src/lib/gacha-ready.ts）。押せる範囲は、この行全体 -->
    <span class="gacha-ready" id="gachaReady" role="img" aria-label="今日のよつばの 準備が できています" hidden></span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </a>

  <!-- 最近の発見 -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-top:20px;">
    <h2 style="margin:0;font-size:24px;font-weight:700;">最近の発見</h2>
    <a href="collection.html" style="display:flex;align-items:center;min-height:56px;padding:0 8px;font-size:18px;font-weight:700;color:var(--accent);text-decoration:none;">すべて見る</a>
  </div>
  <div id="recentGrid" style="display:flex;gap:12px;margin-top:12px;"></div>

</div>

<!-- ボトムナビ -->
<nav aria-label="メインメニュー" class="bottom-nav">
  <a href="index.html" aria-current="page" class="nav-item nav-item--active">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>
    ホーム
  </a>
  <a href="scan.html" aria-label="スキャン" class="nav-camera">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
  </a>
  <a href="collection.html" class="nav-item">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
    図鑑
  </a>
</nav>

<script type="module" src="/src/pages/main.ts"></script>
</body>
</html>
